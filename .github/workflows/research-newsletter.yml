name: Agent-security weekly newsletter

# Runs after the research watch. Issues opened with GITHUB_TOKEN do not trigger `issues` events,
# so this chains on workflow_run and picks up the newest triage issue.
on:
  workflow_run:
    workflows: ["Agent-security research watch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue:
        description: "Triage issue number (default: newest open triage issue)"
        required: false
      force:
        description: "Write a newsletter even if one already exists for this issue"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  models: read

concurrency:
  group: research-newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Find the triage issue
        id: source
        env:
          INPUT_ISSUE: ${{ inputs.issue }}
          FORCE: ${{ inputs.force }}
        run: |
          number="$INPUT_ISSUE"
          if [ -z "$number" ]; then
            # Only accept an issue opened in the last day, so a quiet week does not re-use last week's.
            since=$(date -u -d '1 day ago' +%Y-%m-%d)
            number=$(gh issue list --repo "$REPO" --state open --limit 1 \
              --search "\"Triage agent-security research\" in:title created:>=$since sort:created-desc" \
              --json number --jq '.[0].number // empty')
          fi
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "No recent triage issue; skipping."; exit 0
          fi
          if [ "$FORCE" != "true" ] && gh issue view "$number" --repo "$REPO" --json comments \
              --jq '.comments[].body' | grep -q 'newsletter-for-triage'; then
            echo "Newsletter already written for #$number; skipping."; exit 0
          fi
          gh issue view "$number" --repo "$REPO" --json body --jq .body > report.md
          gh issue list --repo "$REPO" --label newsletter --state all --limit 1 \
            --json body --jq '.[0].body // ""' > previous.md
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Write the newsletter
        if: steps.source.outputs.number
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEWSLETTER_MODEL: ${{ vars.NEWSLETTER_MODEL }}
          SOURCE: ${{ steps.source.outputs.number }}
        run: |
          python tools/write_newsletter.py --report report.md --previous previous.md \
            --issue "$SOURCE" --title-out title.txt > newsletter.md
          cat newsletter.md
      - name: Publish
        if: steps.source.outputs.number
        env:
          SOURCE: ${{ steps.source.outputs.number }}
        run: |
          gh label create newsletter --repo "$REPO" --color 5319e7 \
            --description "Weekly agent-security newsletter" 2>/dev/null || true
          title="Agent Security Weekly $(date -u +%Y-%m-%d): $(cat title.txt)"
          url=$(gh issue create --repo "$REPO" --label newsletter --title "$title" --body-file newsletter.md)
          printf '%s\n\n<!-- newsletter-for-triage -->\n' "Weekly newsletter drafted from this triage: $url" \
            | gh issue comment "$SOURCE" --repo "$REPO" --body-file -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.source.outputs.number
        with:
          name: newsletter
          path: newsletter.md
