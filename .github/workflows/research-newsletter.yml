name: Agent-security weekly newsletter

on:
  schedule:
    - cron: "0 6 * * 3"
      timezone: Europe/Amsterdam
  workflow_dispatch:
    inputs:
      issue:
        description: "Triage issue number (default: newest open triage issue)"
        required: false
      force:
        description: "Write a newsletter even if one already exists for this issue"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: agentlens-content
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/research-watch.yml
    permissions:
      contents: read
      issues: write

  newsletter:
    needs: research
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (needs.research.result == 'success' && needs.research.outputs.issue != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      copilot-requests: write
    outputs:
      issue: ${{ steps.issue.outputs.number }}
      title: ${{ steps.write.outputs.title }}
      date: ${{ steps.write.outputs.date }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Find the triage issue
        id: source
        env:
          INPUT_ISSUE: ${{ needs.research.outputs.issue || inputs.issue }}
          FORCE: ${{ inputs.force }}
        run: |
          number="$INPUT_ISSUE"
          if [ -z "$number" ]; then
            # Only accept an issue opened in the last day, so a quiet week does not re-use last week's.
            since=$(date -u -d '1 day ago' +%Y-%m-%d)
            number=$(gh issue list --repo "$REPO" --state open --limit 1 \
              --search "\"Triage agent-security research\" in:title created:>=$since sort:created-desc" \
              --json number --jq '.[0].number // empty')
          fi
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "No recent triage issue; skipping."; exit 0
          fi
          if [ "$FORCE" != "true" ] && gh issue view "$number" --repo "$REPO" --json comments \
              --jq '.comments[].body' | grep -q 'newsletter-for-triage'; then
            echo "Newsletter already written for #$number; skipping."; exit 0
          fi
          gh issue view "$number" --repo "$REPO" --json body --jq .body > report.md
          gh issue list --repo "$REPO" --search "label:newsletter sort:created-desc" --state all --limit 1 \
            --json body --jq '.[0].body // ""' > previous.md
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Install Copilot CLI
        if: steps.source.outputs.number
        run: npm install --global --ignore-scripts @github/copilot@1.0.109
      - name: Install newsletter renderer
        if: steps.source.outputs.number
        run: python -m pip install -r tools/requirements-newsletter.txt
      - name: Write the newsletter
        id: write
        if: steps.source.outputs.number
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          day=$(TZ=Europe/Amsterdam date +%F)
          python tools/write_newsletter.py --date "$day" --report report.md --previous previous.md \
            --title-out title.txt --html-out newsletter.html > newsletter.md
          printf 'date=%s\ntitle=%s\n' "$day" "$(cat title.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload Markdown edition
        id: markdown
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.source.outputs.number
        with:
          name: newsletter-markdown
          path: newsletter.md
          if-no-files-found: error
      - name: Upload HTML edition
        id: html
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.source.outputs.number
        with:
          name: newsletter-html
          path: newsletter.html
          if-no-files-found: error
      - name: Publish GitHub issue
        id: issue
        if: steps.source.outputs.number
        env:
          SOURCE: ${{ steps.source.outputs.number }}
          MARKDOWN_URL: ${{ steps.markdown.outputs.artifact-url }}
          HTML_URL: ${{ steps.html.outputs.artifact-url }}
          EDITION_DATE: ${{ steps.write.outputs.date }}
        run: |
          if [ -z "$MARKDOWN_URL" ] || [ -z "$HTML_URL" ]; then
            echo "::error::Newsletter artifact download URLs are missing."
            exit 1
          fi
          gh label create newsletter --repo "$REPO" --color 5319e7 \
            --description "Weekly agent-security newsletter" 2>/dev/null || true
          title="Agent Security Weekly $EDITION_DATE: $(cat title.txt)"
          {
            cat newsletter.md
            printf '\n## Downloads\n\n- [Markdown edition (ZIP)](%s)\n- [HTML edition (ZIP)](%s)\n' \
              "$MARKDOWN_URL" "$HTML_URL"
          } > issue.md
          url=$(gh issue create --repo "$REPO" --label newsletter --title "$title" --body-file issue.md)
          printf '%s\n\n<!-- newsletter-for-triage -->\n' "Weekly newsletter drafted from this triage: $url" \
            | gh issue comment "$SOURCE" --repo "$REPO" --body-file -
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

  publish-site:
    needs: newsletter
    if: github.ref_name == github.event.repository.default_branch && needs.newsletter.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.save.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: newsletter-html
          path: ${{ runner.temp }}/agentlens-newsletter
      - name: Save newsletter to the site catalog
        id: save
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ needs.newsletter.outputs.issue }}
          TITLE: ${{ needs.newsletter.outputs.title }}
          EDITION_DATE: ${{ needs.newsletter.outputs.date }}
        run: |
          python tools/publish_newsletter.py -- "$ISSUE" "$TITLE" "$EDITION_DATE" \
            "$RUNNER_TEMP/agentlens-newsletter/newsletter.html"
          git add -- web/publications.json "web/static/newsletter-issue-$ISSUE.html"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Publish Agent Security Weekly #$ISSUE" \
                  -m 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-site:
    needs: publish-site
    uses: ./.github/workflows/deploy-azure.yml
    with:
      revision: ${{ needs.publish-site.outputs.revision }}
    permissions:
      contents: read
      id-token: write
