name: Propose scanner update

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Approved scanner-update issue number (requires scanner-update-approved label)"
        required: true

permissions:
  contents: read

concurrency:
  group: scanner-proposal-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'scanner-update-approved' && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      copilot-requests: write
    outputs:
      decision: ${{ steps.generate.outputs.decision }}
      issue: ${{ steps.task.outputs.issue }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Require a maintainer and an approved task
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid issue number"; exit 1; }
          permission=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "::error::Only maintainers and writers may request scanner proposals"; exit 1 ;;
          esac
          gh api "repos/$REPO/issues/$ISSUE" > "$RUNNER_TEMP/issue.json"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
      - name: Install Copilot CLI
        run: npm install --global --ignore-scripts @github/copilot@1.0.109
      - name: Generate a bounded patch without model tools
        id: generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/propose_scanner_update.py --issue-json "$RUNNER_TEMP/issue.json" \
            --output "$RUNNER_TEMP/proposal"
          decision=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["decision"])' \
            "$RUNNER_TEMP/proposal/proposal.json")
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "Proposal decision: $decision. See the scanner-proposal artifact." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanner-proposal
          path: ${{ runner.temp }}/proposal/
          if-no-files-found: error

  validate:
    needs: propose
    if: needs.propose.outputs.decision == 'propose'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scanner-proposal
          path: ${{ runner.temp }}/proposal
      - name: Install trusted test dependencies before applying the patch
        run: python -m pip install -r requirements-dev.txt
      - name: Check and apply the proposal
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from tools.propose_scanner_update import validate_patch
          folder = Path(os.environ["RUNNER_TEMP"]) / "proposal"
          metadata = json.loads((folder / "proposal.json").read_text())
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == metadata["base"], "Base changed; rerun"
          patch = (folder / "changes.patch").read_text()
          validate_patch(patch)
          subprocess.run(["git", "apply", "-"], input=patch, text=True, check=True)
          PY
      # Proposed Python is untrusted. No publishing token or secrets are exposed in this job.
      - name: Regenerate derived scanner tables and run all checks
        run: |
          python tools/sync_powershell_rules.py
          python tools/build_sample_catalog.py
          python tools/sync_powershell_rules.py --check
          python -m pytest -q tests/
          pwsh -NoProfile -File tests/Test-Scanner.ps1
          python tools/use_cases.py validate
          git diff --check
      - name: Package the exact validated diff
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from tools.propose_scanner_update import allowed_path
          folder = Path(os.environ["RUNNER_TEMP"]) / "proposal"
          # Include new regression tests, without staging them for publication here.
          untracked = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines()
          for name in untracked:
              if not allowed_path(name):
                  raise ValueError(f"Unexpected generated file: {name}")
          if untracked:
              subprocess.run(["git", "add", "--intent-to-add", "--", *untracked], check=True)
          patch = subprocess.check_output(["git", "diff", "--binary", "HEAD"], text=True)
          # Recheck on the clean publisher, not against this already-patched checkout.
          metadata = json.loads((folder / "proposal.json").read_text())
          (folder / "changes.patch").write_text(patch)
          (folder / "validated.json").write_text(json.dumps({
              "base": metadata["base"], "patch_sha256": hashlib.sha256(patch.encode()).hexdigest()
          }))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-scanner-proposal
          path: ${{ runner.temp }}/proposal/
          if-no-files-found: error

  publish:
    needs: [propose, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-scanner-proposal
          path: ${{ runner.temp }}/proposal
      - name: Open a draft PR without running proposed code
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh auth setup-git
          python tools/publish_scanner_proposal.py --proposal "$RUNNER_TEMP/proposal" \
            --repo "$GITHUB_REPOSITORY"
