name: Refresh AgentLens Latest News

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentlens-content
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: latest-news
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Restore the current research index from Blob Storage
        id: restore
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          NEWS_CONTAINER: ${{ vars.AZURE_NEWS_CONTAINER }}
        run: |
          if [ -z "$STORAGE_ACCOUNT" ] || [ -z "$NEWS_CONTAINER" ]; then
            echo "::error::Azure storage variables are missing. Re-run infra/setup-github-oidc.sh."
            exit 1
          fi
          exists=$(az storage blob exists --account-name "$STORAGE_ACCOUNT" \
            --container-name "$NEWS_CONTAINER" --name latest-research.json \
            --auth-mode login --query exists -o tsv)
          if [ "$exists" = "true" ]; then
            az storage blob download --account-name "$STORAGE_ACCOUNT" \
              --container-name "$NEWS_CONTAINER" --name latest-research.json \
              --file web/latest-research.json --auth-mode login --overwrite \
              --only-show-errors
          fi
          cp web/latest-research.json "$RUNNER_TEMP/latest-research-before.json"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - name: Refresh the research index
        id: refresh
        run: |
          python -m tools.update_latest_news
          if cmp -s "$RUNNER_TEMP/latest-research-before.json" web/latest-research.json; then
            echo "No new public research."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the research index to Blob Storage
        if: steps.refresh.outputs.changed == 'true' || steps.restore.outputs.exists != 'true'
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          NEWS_CONTAINER: ${{ vars.AZURE_NEWS_CONTAINER }}
        run: |
          az storage blob upload --account-name "$STORAGE_ACCOUNT" \
            --container-name "$NEWS_CONTAINER" --name latest-research.json \
            --file web/latest-research.json --auth-mode login --overwrite \
            --content-type application/json --only-show-errors
