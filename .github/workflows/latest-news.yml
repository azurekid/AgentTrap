name: Refresh AgentLens Latest News

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agentlens-content
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.refresh.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Refresh and commit the research index
        id: refresh
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python -m tools.update_latest_news
          git add -- web/latest-research.json
          if git diff --cached --quiet; then
            echo "No new public research."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh AgentLens Latest News' \
                -m 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-site:
    needs: refresh
    if: needs.refresh.outputs.revision != ''
    uses: ./.github/workflows/deploy-azure.yml
    with:
      revision: ${{ needs.refresh.outputs.revision }}
    permissions:
      contents: read
      id-token: write
