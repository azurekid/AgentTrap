name: Deploy to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scan_agents_md.py"
      - "credential_rules.json"
      - "allowlist.json"
      - "SOURCES.md"
      - "requirements.txt"
      - "infra/package.sh"
      - "infra/deploy-code.sh"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest -q tests/
      - name: PowerShell parity tests
        shell: pwsh
        run: ./tests/Test-Scanner.ps1
      - name: JavaScript syntax
        run: for f in web/static/*.js; do node --check "$f"; done

  deploy:
    needs: test
    # Skipped until infra/setup-github-oidc.sh has configured the repository variables.
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.health.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Package application
        run: infra/package.sh dist/skillvenom.zip
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to App Service and wait until healthy
        id: health
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: infra/deploy-code.sh "$RESOURCE_GROUP" "$APP_NAME" dist/skillvenom.zip
