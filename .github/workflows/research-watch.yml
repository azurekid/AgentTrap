name: Agent-security research watch

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check research feeds for new articles
        id: check
        run: |
          set +e
          python tools/check_research_feeds.py > report.md
          code=$?
          cat report.md
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ]
      # Feed titles are untrusted text: the report is sanitised, and must be triaged by a person.
      - name: Open a triage issue
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 report.md > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Triage agent-security research ($(date -u +%Y-%m-%d))" --body-file body.md
